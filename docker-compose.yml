version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lostfound-backend
    ports:
      # Maps external port 5002 to internal port 5001 (based on your backend/.env PORT=5001)
      - "5002:5001" 
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lostfound-frontend
    ports:
      # Maps external port 5173 to internal port 5173
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend