name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-push-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the latest code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate with Docker Hub using Secrets
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and Push the Backend Image
      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/lostfound-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/lostfound-backend:latest

      # 4. Build and Push the Frontend Image
      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/lostfound-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/lostfound-frontend:latest

      # 5. SSH into AWS EC2 and deploy
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Successfully connected to EC2!"
            cd ~/lost-and-found-deploy
            
            # Pull the latest images from Docker Hub
            docker compose pull
            
            # Restart containers in detached mode (automatically recreates them with new images)
            docker compose up -d
            
            echo "Deployment successful! Pruning old images..."
            docker image prune -f
